name: CI/CD Pipeline

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      
      - name: Run Ruff linting
        run: ruff check app/
      
      - name: Run Ruff format check
        run: ruff format --check app/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy
      
      - name: Run Mypy type checking
        run: mypy app/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nextcareon_user
          POSTGRES_PASSWORD: nextcareon_password
          POSTGRES_DB: nextcareon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        volume: ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Set environment variables
        run: |
          echo "DATABASE_URL=postgresql+asyncpg://nextcareon_user:nextcareon_password@localhost:5432/nextcareon_test" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
          echo "OPENAI_API_KEY=dummy_key_for_testing" >> $GITHUB_ENV
          echo "SECRET_KEY=test-secret-key-for-ci" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=test-jwt-secret-key" >> $GITHUB_ENV
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  openapi-check:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check OpenAPI docs
        run: |
          python -c "
          import json
          from app.main import app
          openapi = app.openapi()
          assert openapi is not None
          print('OpenAPI spec generated successfully')
          print(f'Title: {openapi.get(\"info\", {}).get(\"title\", \"N/A\")}')
          print(f'Version: {openapi.get(\"info\", {}).get(\"version\", \"N/A\")}')
          "

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, openapi-check]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "Deployment would trigger here"
          echo "Configure your deployment platform (Railway, Render, etc.)"
        env:
          API_KEY: ${{ secrets.DEPLOY_API_KEY }}