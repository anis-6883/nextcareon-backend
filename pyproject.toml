[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nextcareon"
version = "1.0.0"
description = "Career-focused learning platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlmodel==0.0.22",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "redis==5.2.1",
    "hiredis==3.1.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.1",
    "pydantic-settings==2.6.1",
    "python-slugify==8.0.4",
    "pydantic==2.10.3",
    "email-validator==2.2.0",
    "python-multipart==0.0.12",
    "slowapi==0.1.9",
    "limits==3.14.0",
    "structlog==24.4.0",
    "arq==0.26.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "factory-boy==3.3.1",
    "faker==33.1.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "aiosqlite==0.20.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true